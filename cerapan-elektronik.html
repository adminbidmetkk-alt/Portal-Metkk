<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SI-CERAP — Sistem Cerapan Elektronik Metrologi Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#122036;
  --navy-2:#1c3252;
  --paper:#F6F3EC;
  --paper-2:#EFEAE0;
  --ink:#1B2430;
  --muted:#6b7280;
  --brass:#AD8A3D;
  --brass-2:#8f7130;
  --line:#DBD5C6;
  --ok:#2F6B4F;
  --ok-bg:#E4EEE7;
  --bad:#A23B3B;
  --bad-bg:#F3E4E2;
  --warn:#B4761E;
  --radius:10px;
  --shadow:0 1px 2px rgba(18,32,54,.06), 0 4px 14px rgba(18,32,54,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}

/* ---------- Shell ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--navy);
  color:#fff;
  display:flex;align-items:center;gap:14px;
  padding:10px 20px;
  box-shadow:var(--shadow);
}
.topbar .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.topbar .brand-text h1{font-size:16px;margin:0;letter-spacing:.02em;}
.topbar .brand-text p{margin:0;font-size:11px;color:#b9c2d0;letter-spacing:.04em;text-transform:uppercase;}
.topbar nav{margin-left:auto;display:flex;gap:6px;}
.topbar nav button{
  background:transparent;border:1px solid rgba(255,255,255,.18);
  color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;
}
.topbar nav button.active,.topbar nav button:hover{background:rgba(255,255,255,.12);}
#app{max-width:1180px;margin:0 auto;padding:26px 20px 90px;}

/* ---------- Seal / cap tera ---------- */
.seal{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.seal svg{display:block;}

/* ---------- Home ---------- */
.hero{
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  margin-bottom:18px;flex-wrap:wrap;
}
.hero h2{font-size:26px;margin:0 0 6px;}
.hero p{margin:0;color:var(--muted);max-width:520px;font-size:14px;}
.search-box{
  display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:10px 14px;min-width:260px;box-shadow:var(--shadow);
}
.search-box input{border:none;outline:none;flex:1;background:transparent;font-size:14px;}

.disclaimer{
  background:#FBF3E3;border:1px solid #E8D3A0;color:#6a4c14;
  border-radius:10px;padding:12px 16px;font-size:12.5px;line-height:1.55;margin-bottom:22px;
}
.disclaimer b{color:#5a3d0c;}

.cat-block{margin-bottom:26px;}
.cat-title{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
}
.cat-title .num{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass-2);
  border:1px solid var(--brass);border-radius:20px;padding:2px 9px;
}
.cat-title h3{font-size:14px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--navy-2);}
.cat-title .line{flex:1;height:1px;background:var(--line);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;cursor:pointer;transition:.15s border-color,.15s transform;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);
}
.card:hover{border-color:var(--brass);transform:translateY(-2px);}
a.card{text-decoration:none;}
.card .idx{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass-2);}
.card h4{margin:0;font-size:14.5px;font-weight:600;line-height:1.3;}
.card .meta{font-size:11.5px;color:var(--muted);margin-top:auto;}
.card.hidden{display:none;}

/* ---------- Form shell ---------- */
.formhead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.backbtn{
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;
}
.formhead h2{font-size:20px;margin:0;}
.formhead .badge{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--navy);color:#fff;
  padding:4px 10px;border-radius:20px;
}

.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
.sheet-head{
  padding:14px 20px;border-bottom:1px solid var(--line);background:var(--paper-2);
  display:flex;align-items:center;gap:10px;
}
.sheet-head .step{
  width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;
  font-size:11px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
  flex-shrink:0;
}
.sheet-head h3{font-size:14px;margin:0;letter-spacing:.02em;}
.sheet-body{padding:18px 20px;}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:#fdfcfa;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass);}
.field.span2{grid-column:span 2;}
.hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}

.subhead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;}
.subhead h4{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.04em;color:var(--navy-2);}
.subhead:first-child{margin-top:0;}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
table.dt{border-collapse:collapse;width:100%;min-width:640px;}
table.dt th{
  background:var(--navy);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
  padding:9px 8px;text-align:left;white-space:nowrap;font-weight:600;
}
table.dt td{padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
table.dt tr:last-child td{border-bottom:none;}
table.dt input[type=text],table.dt input[type=number]{
  width:100%;min-width:80px;border:1px solid var(--line);border-radius:6px;padding:6px 7px;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:#fdfcfa;
}
table.dt input:focus{outline:2px solid var(--brass);border-color:var(--brass);}
table.dt .computed{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--navy-2);white-space:nowrap;}
.status-badge{
  display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;
  font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;
}
.status-badge.ok{background:var(--ok-bg);color:var(--ok);}
.status-badge.bad{background:var(--bad-bg);color:var(--bad);}
.rowbtn{background:transparent;border:none;color:var(--bad);font-size:16px;padding:2px 6px;border-radius:6px;}
.rowbtn:hover{background:var(--bad-bg);}

.smallbtn{
  background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--navy-2);
}
.smallbtn:hover{border-color:var(--brass);color:var(--brass-2);}
.smallbtn.ghost-add{border-style:dashed;}

.checkline{display:flex;align-items:center;gap:8px;font-size:13px;}

/* signature */
.signers{display:flex;flex-direction:column;gap:14px;}
.signer{border:1px solid var(--line);border-radius:9px;padding:14px;background:var(--paper-2);position:relative;}
.signer .remove{position:absolute;top:10px;right:10px;}
.sigmethod{display:flex;gap:14px;margin:10px 0;}
.sigpad-wrap{border:1.5px dashed var(--line);border-radius:8px;background:#fff;position:relative;}
canvas.sig-canvas{display:block;width:100%;height:150px;touch-action:none;border-radius:8px;}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.sig-placeholder{
  height:150px;display:flex;align-items:center;justify-content:center;color:var(--muted);
  font-size:12px;border:1.5px dashed var(--line);border-radius:8px;background:#fff;text-align:center;padding:10px;
}

/* kesimpulan */
.kesimpulan-box{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
.kesimpulan-box .left{flex:1;min-width:260px;}
.suggestbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.suggestbar .lbl{font-size:12px;color:var(--muted);}
.radiorow{display:flex;gap:16px;margin-top:10px;}
.radiorow label{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;}

/* stamp */
.stamp{width:112px;height:112px;flex-shrink:0;}

/* action bar */
.actionbar{
  position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:14px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
  box-shadow:0 -4px 14px rgba(18,32,54,.06);border-radius:var(--radius) var(--radius) 0 0;
}
.btn{border:none;border-radius:8px;padding:11px 18px;font-size:13.5px;font-weight:700;letter-spacing:.01em;}
.btn.primary{background:var(--navy);color:#fff;}
.btn.primary:hover{background:var(--navy-2);}
.btn.accent{background:var(--brass);color:#20180a;}
.btn.accent:hover{background:var(--brass-2);color:#fff;}
.btn.outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn.outline:hover{border-color:var(--bad);color:var(--bad);}
.btn.mr-auto{margin-right:auto;}

/* riwayat */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;font-size:13px;}
table.rw{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
table.rw th{background:var(--navy);color:#fff;font-size:11px;text-transform:uppercase;padding:10px;text-align:left;}
table.rw td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;}
table.rw tr:last-child td{border-bottom:none;}
table.rw tr:hover td{background:var(--paper-2);}
.pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.pill.sah{background:var(--ok-bg);color:var(--ok);}
.pill.batal{background:var(--bad-bg);color:var(--bad);}
.rwactions button{background:transparent;border:none;font-size:13px;padding:4px 6px;color:var(--navy-2);}
.rwactions button:hover{color:var(--brass-2);text-decoration:underline;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}

footer.appfoot{text-align:center;color:var(--muted);font-size:11.5px;padding:20px;}

/* print */
@media print{
  .no-print{display:none !important;}
  body{background:#fff;}
  #app{max-width:none;padding:0;margin:0;}
  .sheet{box-shadow:none;border:1px solid #999;break-inside:avoid;margin-bottom:10px;}
  .actionbar{display:none;}
  table.dt th{background:#eee !important;color:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
@media(max-width:640px){
  .fields{grid-template-columns:1fr;}
  .field.span2{grid-column:span 1;}
  .hero{flex-direction:column;align-items:stretch;}
}
</style>
</head>
<body>

<div class="topbar no-print">
  <div class="brand" data-action="go-home">
    <span class="seal" id="topSeal"></span>
    <div class="brand-text">
      <h1>SI-CERAP</h1>
      <p>Cerapan Elektronik &middot; Metrologi Legal</p>
    </div>
  </div>
  <nav>
    <button data-action="go-home" id="navHome">Beranda</button>
    <button data-action="go-riwayat" id="navRiwayat">Riwayat</button>
  </nav>
</div>

<div id="app"></div>

<footer class="appfoot no-print">SI-CERAP — alat bantu pencatatan cerapan pengujian. Data tersimpan lokal di perangkat ini.</footer>

<script>
/* =======================================================================
   DATA / KONFIGURASI JENIS CERAPAN
   ======================================================================= */
const CATEGORIES = [
  {id:'timbangan', nama:'Timbangan (Alat Ukur Massa)'},
  {id:'cairan',    nama:'Alat Ukur Cairan & BBM'},
  {id:'tangki',    nama:'Tangki Ukur'},
  {id:'meter',     nama:'Meter & Alat Ukur Lainnya'},
];

/* engine: 'linearity' | 'timbangan' | 'pompa' | 'tangki' | 'meterarus' */
/* kodeFormulir mengacu pada Daftar_Cerapan.xlsx (30 formulir resmi).
   Item bertanda BARU ditambahkan agar sesuai daftar resmi; nilai bkd/satuan
   untuk item BARU adalah perkiraan awal dan PERLU DIVERIFIKASI terhadap
   ketentuan teknis yang berlaku sebelum dipakai untuk cerapan resmi. */
const TYPES = [
  {id:'timb-elektronik',       kategori:'timbangan', nama:'Timbangan Elektronik',                            engine:'timbangan', satuan:'kg',     bkd:0.10, kodeFormulir:'F.C.2-06.2.16.1.1'},
  {id:'timb-elektronik-perhiasan', kategori:'timbangan', nama:'Timbangan Elektronik untuk Perhiasan',        engine:'linearity', satuan:'g',      bkd:0.05, kodeFormulir:'F.C.2-06.2.16.1.2'}, // BARU — verifikasi bkd
  {id:'timb-amp',              kategori:'timbangan', nama:'Timbangan Elektronik pada Asphalt Mixing Plant',  engine:'timbangan', satuan:'kg',     bkd:0.10, kodeFormulir:'F.C.2-06.2.16.1.3'},
  {id:'timb-cbp',              kategori:'timbangan', nama:'Timbangan Elektronik pada Concrete Batching Plant', engine:'timbangan', satuan:'kg',   bkd:0.10, kodeFormulir:'F.C.2-06.2.16.1.4'}, // BARU — verifikasi bkd
  {id:'jembatan-timbang',      kategori:'timbangan', nama:'Timbangan Jembatan Elektronik (Weighbridge)',     engine:'timbangan', satuan:'kg',     bkd:0.10, kodeFormulir:'F.C.2-06.2.16.1.5'},
  {id:'timb-pegas',            kategori:'timbangan', nama:'Timbangan Pegas',                                 engine:'linearity', satuan:'kg',     bkd:0.5,  kodeFormulir:'F.C.2-06.2.16.1.6'},
  {id:'timb-cepat',            kategori:'timbangan', nama:'Timbangan Cepat',                                 engine:'linearity', satuan:'kg',     bkd:0.5,  kodeFormulir:'F.C.2-06.2.16.1.7'},
  {id:'timb-cepat-meja',       kategori:'timbangan', nama:'Timbangan Cepat Meja',                             engine:'linearity', satuan:'kg',     bkd:0.5,  kodeFormulir:'F.C.2-06.2.16.2.1'}, // BARU — verifikasi bkd
  {id:'neraca',                kategori:'timbangan', nama:'Neraca',                                          engine:'linearity', satuan:'g',      bkd:0.05, kodeFormulir:'F.C.2-06.2.16.3.1'}, // BARU — verifikasi bkd
  {id:'timb-dacin-logam',      kategori:'timbangan', nama:'Timbangan Dacin Logam',                            engine:'linearity', satuan:'kg',     bkd:0.5,  kodeFormulir:'F.C.2-06.2.16.3.2'}, // BARU — verifikasi bkd
  {id:'timb-sentisimal',       kategori:'timbangan', nama:'Timbangan Sentisimal',                             engine:'linearity', satuan:'kg',     bkd:0.25, kodeFormulir:'F.C.2-06.2.16.3.4'},
  {id:'timb-bobot-ingsut',     kategori:'timbangan', nama:'Timbangan Bobot Ingsut',                           engine:'linearity', satuan:'kg',     bkd:0.25, kodeFormulir:'F.C.2-06.2.16.3.6'}, // BARU — verifikasi bkd
  {id:'timb-meja',             kategori:'timbangan', nama:'Timbangan Meja',                                   engine:'linearity', satuan:'kg',     bkd:0.25, kodeFormulir:'F.C.2-06.2.16.3.7'},
  {id:'timb-conveyor',         kategori:'timbangan', nama:'Timbangan Ban Berjalan (Belt Conveyor Scale)',     engine:'linearity', satuan:'ton',    bkd:0.5,  kodeFormulir:'F.C.2-06.2.15.1'},
  {id:'wim',                   kategori:'timbangan', nama:'Weighing in Motion',                               engine:'timbangan', satuan:'kg',     bkd:0.5,  kodeFormulir:'F.C.2-06.2.15.2'}, // BARU — verifikasi bkd
  {id:'timb-checker-sorter',   kategori:'timbangan', nama:'Timbangan Pengecek dan Penyortir',                 engine:'linearity', satuan:'kg',     bkd:0.5,  kodeFormulir:'F.C.2-06.2.15.4'}, // BARU — verifikasi bkd
  {id:'anak-timbangan',        kategori:'timbangan', nama:'Anak Timbangan',                                   engine:'linearity', satuan:'g',      bkd:0.05, kodeFormulir:'F.C.2-06.2.26'},
  {id:'pompa-bbm',         kategori:'cairan', nama:'Pompa Ukur BBM (SPBU)',                             engine:'pompa', satuan:'L', bkd:0.5, volNominal:20, kodeFormulir:'F.C.2-06.2.18'},
  {id:'meter-arus-migas',  kategori:'cairan', nama:'Meter Arus BBM metode Volumetrik',                  engine:'meterarus', satuan:'L', bkd:0.3, kodeFormulir:'F.C.2-06.2.21.1'},
  {id:'meter-arus-gravimetrik', kategori:'cairan', nama:'Meter Arus BBM metode Gravimetrik',            engine:'meterarus', satuan:'kg', bkd:0.3, kodeFormulir:'F.C.2-06.2.21.2'}, // BARU — verifikasi bkd
  {id:'takaran-kering',    kategori:'cairan', nama:'Takaran Kering',                                    engine:'linearity', satuan:'L', bkd:0.5, kodeFormulir:'F.C.2-06.2.9.1'}, // BARU — verifikasi bkd
  {id:'takaran-basah',     kategori:'cairan', nama:'Takaran Basah',                                     engine:'linearity', satuan:'L', bkd:0.5, kodeFormulir:'F.C.2-06.2.9.2'}, // BARU — verifikasi bkd
  {id:'level-gauge',       kategori:'cairan', nama:'Automatic Level Gauge',                             engine:'linearity', satuan:'cm', bkd:0.2, kodeFormulir:'F.C.2-06.2.4.5'},

  {id:'tum',               kategori:'tangki', nama:'Tangki Ukur Mobil (TUM)',                           engine:'tangki', satuan:'L', bkd:0.2, kodeFormulir:'F.C.2-06.2.10'},
  {id:'tangki-tegak',      kategori:'tangki', nama:'Tangki Ukur Tetap Silinder Tegak',                  engine:'tangki', satuan:'L', bkd:0.2, kodeFormulir:'F.C.2-06.2.11'},
  {id:'tangki-bola',       kategori:'tangki', nama:'Tangki Ukur Tetap Bentuk Bola',                     engine:'tangki', satuan:'L', bkd:0.2, kodeFormulir:'F.C.2-06.2.12'}, // BARU — verifikasi bkd

  {id:'meter-kayu',        kategori:'meter', nama:'Meter Kayu',                                         engine:'linearity', satuan:'m³', bkd:1, kodeFormulir:'F.C.2-06.2.1'}, // BARU — verifikasi bkd & satuan
  {id:'meter-air',         kategori:'meter', nama:'Meter Air',                                          engine:'linearity', satuan:'L', bkd:2, kodeFormulir:'F.C.2-06.2.23'},
  {id:'meter-parkir',      kategori:'meter', nama:'Meter Parkir',                                       engine:'linearity', satuan:'menit', bkd:1, kodeFormulir:'F.C.2-06.2.8'},
  {id:'moisture-tester',   kategori:'meter', nama:'Meter Kadar Air (Moisture Tester)',                  engine:'linearity', satuan:'%', bkd:2, kodeFormulir:'F.C.2-06.2.17'},
];

const findType = id => TYPES.find(t=>t.id===id);

// Pemetaan jenis cerapan ke berkas HTML mandiri (jika tersedia).
// Jika sebuah typeId tidak ada di sini, kartu akan tetap membuka form bawaan aplikasi ini.
const STANDALONE_LINKS = {
  'pompa-bbm':                 'Cerapan_Elektronik_PU_BBM.html',
  'tum':                       'Cerapan_Elektronik_Tangki_Ukur_Mobil.html',
  'timb-elektronik':           'Cerapan_Elektronik_Timbangan.html',
  'timb-amp':                  'Cerapan_Elektronik_Timbangan_AMP.html',
  'timb-cbp':                  'Cerapan_Elektronik_Timbangan_CBP.html',
  'timb-pegas':                'Cerapan_Elektronik_Timbangan_Pegas.html',
  'timb-elektronik-perhiasan': 'Cerapan_Elektronik_Timbangan_Perhiasan.html',
  'jembatan-timbang':          'Cerapan_Elektronik_TJE.html',
};

/* =======================================================================
   STORAGE
   ======================================================================= */
const STORE_KEY = 'sicerap_records_v1';
function loadRecords(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||[]; }catch(e){ return []; } }
function saveRecords(list){ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
function upsertRecord(rec){
  const list = loadRecords();
  const i = list.findIndex(r=>r.id===rec.id);
  if(i>=0) list[i]=rec; else list.unshift(rec);
  saveRecords(list);
}

function getRecord(id){ return loadRecords().find(r=>r.id===id); }

function uid(){ return 'cr_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nomorCerapan(prefix){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  return `${prefix}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${Math.floor(Math.random()*900+100)}`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function sealSVG(size, status){
  // status: null (neutral brass), 'ok' (sah, green), 'bad' (batal, red)
  const color = status==='ok' ? '#2F6B4F' : status==='bad' ? '#A23B3B' : '#AD8A3D';
  const label = status==='ok' ? 'SAH' : status==='bad' ? 'BATAL' : 'TERA';
  const id = 'seal'+Math.random().toString(36).slice(2,8);
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs><path id="${id}" d="M 60,60 m -42,0 a 42,42 0 1,1 84,0 a 42,42 0 1,1 -84,0"/></defs>
    <circle cx="60" cy="60" r="56" fill="none" stroke="${color}" stroke-width="2"/>
    <circle cx="60" cy="60" r="48" fill="none" stroke="${color}" stroke-width="1"/>
    <text font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="2" fill="${color}">
      <textPath href="#${id}" xlink:href="#${id}" startOffset="2%">• METROLOGI LEGAL • REPUBLIK INDONESIA •</textPath>
    </text>
    <text x="60" y="55" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="17" fill="${color}">${label}</text>
    <text x="60" y="72" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8" fill="${color}">SI-CERAP</text>
    <path d="M40,60 l14,14 l28,-30" fill="none" stroke="${color}" stroke-width="${status?3:0}" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
document.getElementById('topSeal').innerHTML = sealSVG(32,null);

        <p>30 jenis cerapan pengujian UTTP metrologi legal — isian dan perhitungan otomatis sesuai jenis alat, dengan tanda tangan digital atau langsung untuk setiap berkas.</p>

        <input id="searchBox" placeholder="Cari jenis cerapan…">
      </div>
    </div>
    <div class="disclaimer">
      <b>Catatan penting.</b> Batas Kesalahan Diizinkan (BKD), titik uji, dan struktur isian pada tiap jenis cerapan di aplikasi ini adalah <b>templat awal</b> untuk mempercepat pencatatan. Sebelum dipakai sebagai dasar keputusan sah/batal resmi, sesuaikan BKD dan tata cara pengujian dengan syarat teknis (SK Dirjen/Juknis) UTTP terkait yang berlaku. Nilai pada tiap kolom dapat diedit bebas.
    </div>

function sectionTandaTangan(stepNo, signers){
  signers = signers && signers.length ? signers : [
    {role:'Pegawai Berhak / Penera', metode:'digital'},
    {role:'Pemilik / Kuasa', metode:'digital'}
  ];
  const blocks = signers.map((s,i)=>signerBlock(i,s)).join('');
  return `
  <div class="sheet" data-section="ttd">
    <div class="sheet-head"><span class="step">${stepNo}</span><h3>Tanda Tangan</h3></div>
    <div class="sheet-body">
      <div class="signers" id="signersWrap">${blocks}</div>
      <div style="margin-top:12px;"><button type="button" class="smallbtn ghost-add" data-action="add-signer">+ Tambah Penandatangan</button></div>
      <input type="hidden" name="signerCount" value="${signers.length}">
    </div>
  </div>`;
}

/* =======================================================================
   RENDER FORM
   ======================================================================= */
function renderForm(typeId, recordId){
  const t = findType(typeId);
  if(!t){ goHome(); return; }
  const existing = recordId ? getRecord(recordId) : null;
  const nomor = existing ? existing.nomor : nomorCerapan('CR');

  let engineSection = '';
  let step = 2;
  if(t.engine==='linearity') engineSection = sectionLinearity(t, step);
  else if(t.engine==='timbangan') engineSection = sectionTimbangan(t, step);
  else if(t.engine==='pompa') engineSection = sectionPompa(t, step);
  else if(t.engine==='meterarus') engineSection = sectionMeterArus(t, step);
  else if(t.engine==='tangki') engineSection = sectionTangki(t, step);

  const kesimpulanStep = t.engine==='timbangan' ? 5 : 3;
  const ttdStep = kesimpulanStep+1;

  appEl.innerHTML = `
    <div class="formhead no-print">
      <button class="backbtn" data-action="go-home">← Beranda</button>
      <h2>${esc(t.nama)}</h2>
      <span class="badge">${esc(nomor)}</span>
      <span class="badge" style="background:var(--brass);color:#20180a;">${esc(t.satuan)}</span>
      ${t.kodeFormulir?`<span class="badge mono">${esc(t.kodeFormulir)}</span>`:''}
    </div>
    <form id="cerapanForm" autocomplete="off">
      <input type="hidden" name="typeId" value="${t.id}">
      <input type="hidden" name="nomor" value="${esc(nomor)}">
      ${fieldsDataUmum(t)}
      ${engineSection}
      ${sectionKesimpulan(kesimpulanStep)}
      ${sectionTandaTangan(ttdStep, existing ? existing.signers : null)}
    </form>
    <div class="actionbar no-print">
      ${existing ? `<button class="btn outline" data-action="delete-record" data-id="${existing.id}">Hapus</button>` : ''}
      <button class="btn outline" data-action="reset-form">Bersihkan Form</button>
      <span class="mr-auto"></span>
      <button class="btn primary" data-action="save-form">Simpan Cerapan</button>
      <button class="btn accent" data-action="save-print">Simpan &amp; Cetak / PDF</button>
    </div>
  `;

  // init canvases
  document.querySelectorAll('canvas.sig-canvas').forEach(initCanvas);
  document.getElementById('stampBox').innerHTML = sealSVG(112, null);

  if(existing){ populateForm(existing); }
  recalcAll();
}

  rows.forEach(r=> max = Math.max(max, parseInt(r.dataset.idx,10)));
  return max+1;
}

    container.querySelectorAll('[data-section="komp"]').forEach((el,i)=>{ if(i>=wanted) el.remove(); });

  recalcAll();
}

/* =======================================================================
   SIGNATURE CANVAS
   ======================================================================= */
let drawingCanvas = null, drawCtx = null, lastPt = null;
function fitCanvas(canvas){
  const ratio = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if(w===0||h===0) return;
  canvas.width = w*ratio; canvas.height = h*ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio,ratio);
  ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle = '#122036';
}
function initCanvas(canvas){
  canvas.dataset.init = '1';
  requestAnimationFrame(()=>fitCanvas(canvas));
}
document.addEventListener('pointerdown', e=>{
  if(e.target.tagName==='CANVAS' && e.target.classList.contains('sig-canvas')){
    drawingCanvas = e.target; drawCtx = drawingCanvas.getContext('2d');
    drawingCanvas.setPointerCapture(e.pointerId);
    const r = drawingCanvas.getBoundingClientRect();
    lastPt = [e.clientX-r.left, e.clientY-r.top];
  }
});
document.addEventListener('pointermove', e=>{
  if(!drawingCanvas) return;
  const r = drawingCanvas.getBoundingClientRect();
  const pt = [e.clientX-r.left, e.clientY-r.top];
  drawCtx.beginPath(); drawCtx.moveTo(lastPt[0],lastPt[1]); drawCtx.lineTo(pt[0],pt[1]); drawCtx.stroke();
  lastPt = pt;
});
function endStroke(){
  if(drawingCanvas){
    const idx = drawingCanvas.dataset.sig;
    const hidden = document.querySelector(`input[name="signer_${idx}_ttd"]`);
    if(hidden) hidden.value = drawingCanvas.toDataURL('image/png');
  }
  drawingCanvas = null; drawCtx = null; lastPt = null;
}
document.addEventListener('pointerup', endStroke);
document.addEventListener('pointerleave', endStroke);

function clearSig(idx){
  const canvas = document.querySelector(`canvas[data-sig="${idx}"]`);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore();
  const hidden = document.querySelector(`input[name="signer_${idx}_ttd"]`);
  if(hidden) hidden.value = '';
}

/* =======================================================================
   RECALCULATION
   ======================================================================= */
function num(v){ const n = parseFloat(v); return isNaN(n)?0:n; }
function fmt(n){ return (Math.round(n*10000)/10000).toFixed(4); }

function globalBkd(scope){
  const g = scope.querySelector('[data-calc="global"]');
  return g ? num(g.value) : 0;
}

function recalcLinTable(){
  document.querySelectorAll('[data-body="lin"] tr[data-row="lin"]').forEach(tr=>{
    const scope = tr.closest('[data-engine]') || document;
    const bkdG = globalBkd(scope);
    const standar = num(tr.querySelector('[data-f="standar"]').value);
    const penunjukan = num(tr.querySelector('[data-f="penunjukan"]').value);
    const bkdOverrideEl = tr.querySelector('[data-f="bkd"]');
    const bkd = bkdOverrideEl.value!=='' ? num(bkdOverrideEl.value) : bkdG;
    const kesalahan = penunjukan - standar;
    const pct = standar!==0 ? (kesalahan/standar*100) : 0;
    const bkdAbs = Math.abs(standar*bkd/100);
    const status = (standar===0 && penunjukan===0) ? 'MS' : (Math.abs(kesalahan)<=bkdAbs ? 'MS':'TMS');
    tr.querySelector('[data-f="kesalahan"]').textContent = fmt(kesalahan);
    tr.querySelector('[data-f="pct"]').textContent = standar!==0 ? pct.toFixed(3)+'%' : '-';
    const st = tr.querySelector('[data-f="status"]');
    st.textContent = status; st.className = 'status-badge ' + (status==='MS'?'ok':'bad');
  });
}
function recalcEksTable(){
  const scope = document.querySelector('[data-section="eksentris"]');
  if(!scope) return;
  const bkdG = globalBkd(scope);
  const refInput = scope.querySelector('[data-f="penunjukan"][data-ref="1"]');
  const ref = refInput ? num(refInput.value) : 0;
  scope.querySelectorAll('tr[data-row="eks"]').forEach(tr=>{
    const penunjukan = num(tr.querySelector('[data-f="penunjukan"]').value);
    const bkdOverrideEl = tr.querySelector('[data-f="bkd"]');
    const bkd = bkdOverrideEl.value!=='' ? num(bkdOverrideEl.value) : bkdG;
    const kesalahan = penunjukan - ref;
    const bkdAbs = Math.abs(ref*bkd/100);
    const status = (ref===0) ? 'MS' : (Math.abs(kesalahan)<=bkdAbs ? 'MS':'TMS');
    tr.querySelector('[data-f="kesalahan"]').textContent = fmt(kesalahan);
    const st = tr.querySelector('[data-f="status"]');
    st.textContent = status; st.className = 'status-badge ' + (status==='MS'?'ok':'bad');
  });
}
function recalcPompaTable(){
  const scope = document.querySelector('[data-engine="pompa"]');
  if(!scope) return;
  const bkdG = globalBkd(scope);
  scope.querySelectorAll('tr[data-row="pmp"]').forEach(tr=>{
    const standar = num(tr.querySelector('[data-f="standar"]').value);
    const penunjukan = num(tr.querySelector('[data-f="penunjukan"]').value);
    const kesalahan = penunjukan - standar;
    const pct = standar!==0 ? (kesalahan/standar*100) : 0;
    const bkdAbs = Math.abs(standar*bkdG/100);
    const status = (standar===0 && penunjukan===0) ? 'MS' : (Math.abs(kesalahan)<=bkdAbs ? 'MS':'TMS');
    tr.querySelector('[data-f="kesalahan"]').textContent = fmt(kesalahan);
    tr.querySelector('[data-f="pct"]').textContent = standar!==0 ? pct.toFixed(3)+'%' : '-';
    const st = tr.querySelector('[data-f="status"]');
    st.textContent = status; st.className = 'status-badge ' + (status==='MS'?'ok':'bad');
  });
}
function recalcMeterArus(){
  const scope = document.querySelector('[data-engine="mtr"]');
  if(!scope) return;
  const bkdG = globalBkd(scope);
  scope.querySelectorAll('tr[data-row="mtr"]').forEach(tr=>{
    const prover = num(tr.querySelector('[data-f="prover"]').value);
    const meter = num(tr.querySelector('[data-f="meter"]').value);
    const mf = meter!==0 ? (prover/meter) : 0;
    const pct = prover!==0 ? ((meter-prover)/prover*100) : 0;
    const status = (prover===0 && meter===0) ? 'MS' : (Math.abs(pct)<=bkdG ? 'MS':'TMS');
    tr.querySelector('[data-f="mf"]').textContent = mf.toFixed(4);
    tr.querySelector('[data-f="pct"]').textContent = prover!==0 ? pct.toFixed(3)+'%' : '-';
    const st = tr.querySelector('[data-f="status"]');
    st.textContent = status; st.className = 'status-badge ' + (status==='MS'?'ok':'bad');
  });
}
function recalcTangki(){
  document.querySelectorAll('[data-section="komp"]').forEach(block=>{
    const kIdx = block.dataset.komp;
    const rows = Array.from(block.querySelectorAll(`tr[data-row="tgk"]`)).sort((a,b)=>a.dataset.idx-b.dataset.idx);
    let prevVol=null, prevH=null;
    rows.forEach(tr=>{
      const vol = num(tr.querySelector('[data-f="vol"]').value);
      const h = num(tr.querySelector('[data-f="tinggi"]').value);
      const cell = tr.querySelector('[data-f="volpercm"]');
      if(prevVol!==null && (h-prevH)!==0){
        cell.textContent = (( vol-prevVol )/( h-prevH )).toFixed(3);
      } else { cell.textContent = '-'; }
      prevVol = vol; prevH = h;
    });
    const kapNominal = num(block.querySelector(`[name="tgk_${kIdx}_kapNominal"]`).value);
    const volTotal = num(block.querySelector(`[name="tgk_${kIdx}_volTotal"]`).value);
    const bkdG = globalBkd(document.querySelector('[data-section="tgk-head"]'));
    const kesalahan = volTotal - kapNominal;
    const bkdAbs = Math.abs(kapNominal*bkdG/100);
    const status = (kapNominal===0) ? 'MS' : (Math.abs(kesalahan)<=bkdAbs ? 'MS':'TMS');
    block.querySelector(`[data-f="tgk_kesalahan_${kIdx}"]`).textContent = fmt(kesalahan);
    const st = block.querySelector(`[data-f="tgk_status_${kIdx}"]`);
    st.textContent = status; st.className='status-badge '+(status==='MS'?'ok':'bad');
  });
}
function recalcKesimpulan(){
  const badges = document.querySelectorAll('.status-badge[data-f]');
  let anyBad=false, any=false;
  badges.forEach(b=>{ any=true; if(b.classList.contains('bad')) anyBad=true; });
  document.querySelectorAll('[id^="tgk_status_"]');
  const suggest = document.getElementById('autoSuggest');
  if(!suggest) return;
  if(anyBad){ suggest.textContent='TIDAK MEMENUHI SYARAT'; suggest.className='status-badge bad'; }
  else { suggest.textContent = any ? 'MEMENUHI SYARAT' : 'BELUM ADA DATA'; suggest.className='status-badge '+(any?'ok':'bad'); }
  const keputusan = document.querySelector('input[name="keputusan"]:checked');
  const stampBox = document.getElementById('stampBox');
  if(stampBox && keputusan){
    stampBox.innerHTML = sealSVG(112, keputusan.value==='SAH' ? 'ok' : 'bad');
  }
}
function recalcAll(){
  if(document.querySelector('[data-body="lin"]')) recalcLinTable();
  if(document.querySelector('[data-section="eksentris"]')) recalcEksTable();
  if(document.querySelector('[data-engine="pompa"]')) recalcPompaTable();
  if(document.querySelector('[data-engine="mtr"]')) recalcMeterArus();
  if(document.querySelector('[data-section="komp"]')) recalcTangki();
  recalcKesimpulan();
}

/* =======================================================================
   SAVE / LOAD / SERIALIZE
   ======================================================================= */
function serializeForm(){
  const form = document.getElementById('cerapanForm');
  const data = {};
  Array.from(form.elements).forEach(el=>{
    if(!el.name) return;
    if(el.type==='radio'){ if(el.checked) data[el.name]=el.value; }
    else if(el.type==='checkbox'){ data[el.name]=el.checked; }
    else { data[el.name]=el.value; }
  });
  // signer metode not captured by radio name uniqueness issue -> already fine since unique per signer
  const signerCount = parseInt(data.signerCount||'0',10);
  const signers = [];
  for(let i=0;i<signerCount;i++){
    signers.push({
      role: data[`signer_${i}_role`]||'',
      nama: data[`signer_${i}_nama`]||'',
      nip: data[`signer_${i}_nip`]||'',
      jabatan: data[`signer_${i}_jabatan`]||'',
      metode: data[`signer_${i}_metode`]||'digital',
      ttd: data[`signer_${i}_ttd`]||'',
    });
  }
  return {data, signers};
}
function buildRecord(existingId){
  const {data, signers} = serializeForm();
  const t = findType(data.typeId);
  return {
    id: existingId || uid(),
    typeId: data.typeId,
    typeNama: t.nama,
    nomor: data.nomor,
    namaPemilik: data.namaPemilik||'',
    tanggalUji: data.tanggalUji||todayISO(),
    keputusan: data.keputusan||'SAH',
    createdAt: existingId ? (getRecord(existingId)||{}).createdAt || new Date().toISOString() : new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    formData: data,
    signers,
  };
}
function populateForm(rec){
  const form = document.getElementById('cerapanForm');
  const data = rec.formData;
  // adjust dynamic row counts first
  const wantLin = Math.max(1, parseInt(data.rows_lin||'5',10));
  const bodyLin = document.querySelector('[data-body="lin"]');
  if(bodyLin){ while(bodyLin.querySelectorAll('tr').length<wantLin) addRow('lin'); while(bodyLin.querySelectorAll('tr').length>wantLin && bodyLin.querySelectorAll('tr').length>1) removeRow('lin', bodyLin.lastElementChild); }
  const wantKpk = Math.max(1, parseInt(data.rows_kpk||'3',10));
  const bodyKpk = document.querySelector('[data-body="kpk"]');
  if(bodyKpk){ while(bodyKpk.querySelectorAll('tr').length<wantKpk) addRow('kpk'); while(bodyKpk.querySelectorAll('tr').length>wantKpk && bodyKpk.querySelectorAll('tr').length>1) removeRow('kpk', bodyKpk.lastElementChild); }
  const wantPmp = Math.max(1, parseInt(data.rows_pmp||'3',10));
  const bodyPmp = document.querySelector('[data-body="pmp"]');
  if(bodyPmp){ while(bodyPmp.querySelectorAll('tr').length<wantPmp) addRow('pmp'); while(bodyPmp.querySelectorAll('tr').length>wantPmp && bodyPmp.querySelectorAll('tr').length>1) removeRow('pmp', bodyPmp.lastElementChild); }
  const wantMtr = Math.max(1, parseInt(data.rows_mtr||'3',10));
  const bodyMtr = document.querySelector('[data-body="mtr"]');
  if(bodyMtr){ while(bodyMtr.querySelectorAll('tr').length<wantMtr) addRow('mtr'); while(bodyMtr.querySelectorAll('tr').length>wantMtr && bodyMtr.querySelectorAll('tr').length>1) removeRow('mtr', bodyMtr.lastElementChild); }
  // tangki komp
  if(document.querySelector('[name="kompCount"]')){
    document.querySelector('[name="kompCount"]').value = data.kompCount_stored || data.kompCount || '1';
    applyKompCount();
    document.querySelectorAll('[data-section="komp"]').forEach(block=>{
      const kIdx = block.dataset.komp;
      const wantRows = Math.max(1, parseInt(data[`rows_tgk_${kIdx}`]||'5',10));
      const body = block.querySelector(`[data-body="tgk-${kIdx}"]`);
      if(body){ while(body.querySelectorAll('tr').length<wantRows) addRow('tgk', kIdx); while(body.querySelectorAll('tr').length>wantRows && body.querySelectorAll('tr').length>1) removeRow('tgk', body.lastElementChild, kIdx); }
    });
  }
  // signers
  const wantSigners = Math.max(1, rec.signers ? rec.signers.length : 2);
  const wrap = document.getElementById('signersWrap');
  while(wrap.querySelectorAll('[data-signer]').length<wantSigners) addSigner();
  while(wrap.querySelectorAll('[data-signer]').length>wantSigners && wrap.querySelectorAll('[data-signer]').length>1) removeSigner(wrap.querySelectorAll('[data-signer]').length-1);
  // set metode selects to trigger correct sigarea render
  rec.signers.forEach((s,i)=>{
    const radio = document.querySelector(`input[name="signer_${i}_metode"][value="${s.metode}"]`);
    if(radio){ radio.checked = true; switchSigMethod(i, s.metode); }
  });
  // now populate all simple fields
  Array.from(form.elements).forEach(el=>{
    if(!el.name || !(el.name in data)) return;
    if(el.type==='radio'){ el.checked = (el.value===data[el.name]); }
    else if(el.type==='checkbox'){ el.checked = !!data[el.name]; }
    else { el.value = data[el.name]; }
  });
  // draw signature images
  rec.signers.forEach((s,i)=>{
    if(s.metode==='digital' && s.ttd){
      const canvas = document.querySelector(`canvas[data-sig="${i}"]`);
      if(canvas){
        const img = new Image();
        img.onload = ()=>{ const ctx=canvas.getContext('2d'); ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); ctx.drawImage(img,0,0,canvas.clientWidth,canvas.clientHeight); };
        img.src = s.ttd;
      }
    }
  });
  recalcAll();
}

/* =======================================================================
   RIWAYAT
   ======================================================================= */
function renderRiwayat(){
  const list = loadRecords();
  const filterHTML = `
    <div class="toolbar no-print">
      <select id="fJenis"><option value="">Semua Jenis</option>${TYPES.map(t=>`<option value="${t.id}">${esc(t.nama)}</option>`).join('')}</select>
      <input type="text" id="fCari" placeholder="Cari nama pemilik / nomor…">
      <select id="fKeputusan"><option value="">Semua Keputusan</option><option value="SAH">Sah</option><option value="BATAL">Batal</option></select>
    </div>`;
  appEl.innerHTML = `
    <div class="hero"><div><h2>Riwayat Cerapan</h2><p>${list.length} cerapan tersimpan di perangkat ini.</p></div></div>
    ${filterHTML}
    <div id="riwayatTableWrap"></div>
  `;
  function draw(){
    const jenis = document.getElementById('fJenis').value;
    const cari = document.getElementById('fCari').value.trim().toLowerCase();
    const kep = document.getElementById('fKeputusan').value;
    const filtered = list.filter(r=>{
      if(jenis && r.typeId!==jenis) return false;
      if(kep && r.keputusan!==kep) return false;
      if(cari && !( (r.namaPemilik||'').toLowerCase().includes(cari) || (r.nomor||'').toLowerCase().includes(cari) )) return false;
      return true;
    });
    const wrap = document.getElementById('riwayatTableWrap');
    if(filtered.length===0){ wrap.innerHTML = `<div class="empty">Belum ada cerapan yang cocok. Buat cerapan baru dari menu Beranda.</div>`; return; }
    wrap.innerHTML = `
    <table class="rw"><thead><tr>
      <th>Nomor</th><th>Jenis</th><th>Pemilik</th><th>Tanggal</th><th>Keputusan</th><th>Aksi</th>
    </tr></thead><tbody>
      ${filtered.map(r=>`
        <tr>
          <td class="mono">${esc(r.nomor)}</td>
          <td>${esc(r.typeNama)}</td>
          <td>${esc(r.namaPemilik||'—')}</td>
          <td class="mono">${esc(r.tanggalUji||'—')}</td>
          <td><span class="pill ${r.keputusan==='SAH'?'sah':'batal'}">${esc(r.keputusan)}</span></td>
          <td class="rwactions">
            <button data-action="open-record" data-id="${r.id}">Buka</button>
            <button data-action="dup-record" data-id="${r.id}">Duplikat</button>
            <button data-action="delete-record" data-id="${r.id}">Hapus</button>
          </td>
        </tr>`).join('')}
    </tbody></table>`;
  }
  document.getElementById('fJenis').addEventListener('change', draw);
  document.getElementById('fCari').addEventListener('input', draw);
  document.getElementById('fKeputusan').addEventListener('change', draw);
  draw();
}

/* =======================================================================
   EVENT DELEGATION
   ======================================================================= */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  if(action==='go-home') goHome();
  else if(action==='go-riwayat') goRiwayat();
  else if(action==='new-cerapan') goForm(t.dataset.type);
  else if(action==='add-row') addRow(t.dataset.target, t.dataset.komp);
  else if(action==='rm-row') removeRow(t.dataset.target, t.closest('tr'), t.dataset.komp);
  else if(action==='set-komp') applyKompCount();
  else if(action==='add-signer') addSigner();
  else if(action==='rm-signer') removeSigner(parseInt(t.dataset.idx,10));
  else if(action==='clear-sig') clearSig(t.dataset.idx);
  else if(action==='reset-form'){ if(confirm('Bersihkan seluruh isian form ini?')) goForm(CURRENT.typeId); }
  else if(action==='save-form'){ const rec=buildRecord(CURRENT.recordId); upsertRecord(rec); CURRENT.recordId=rec.id; alert('Cerapan tersimpan: '+rec.nomor); }
  else if(action==='save-print'){ const rec=buildRecord(CURRENT.recordId); upsertRecord(rec); CURRENT.recordId=rec.id; setTimeout(()=>window.print(),150); }
  else if(action==='delete-record'){ if(confirm('Hapus cerapan ini secara permanen?')){ deleteRecord(t.dataset.id); if(CURRENT.view==='form') goRiwayat(); else renderRiwayat(); } }
  else if(action==='open-record'){ const r=getRecord(t.dataset.id); goForm(r.typeId, r.id); }
  else if(action==='dup-record'){ const r=getRecord(t.dataset.id); const copy=JSON.parse(JSON.stringify(r)); copy.id=uid(); copy.nomor=nomorCerapan('CR'); copy.formData.nomor=copy.nomor; upsertRecord(copy); goForm(copy.typeId, copy.id); }
});
document.addEventListener('input', e=>{
  if(e.target.closest('#cerapanForm')) recalcAll();
});
document.addEventListener('change', e=>{
  if(e.target.dataset.action==='sig-method'){
    const name = e.target.name; // signer_i_metode
    const idx = name.match(/signer_(\d+)_metode/)[1];
    switchSigMethod(idx, e.target.value);
  }
  if(e.target.closest('#cerapanForm')) recalcAll();
});
window.addEventListener('resize', ()=>{
  document.querySelectorAll('canvas.sig-canvas').forEach(c=>{
    const dataBefore = document.querySelector(`input[name="signer_${c.dataset.sig}_ttd"]`);
    fitCanvas(c);
    if(dataBefore && dataBefore.value){
      const img = new Image();
      img.onload=()=>c.getContext('2d').drawImage(img,0,0,c.clientWidth,c.clientHeight);
      img.src = dataBefore.value;
    }
  });
});

/* =======================================================================
   INIT
   ======================================================================= */
goHome();
</script>
